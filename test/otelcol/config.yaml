# To limit exposure to denial of service attacks, the receiver endpoints below
# are bound to 127.0.0.1.  Change them to 0.0.0.0 (or another interface) if the
# Collector needs to accept remote connections.
# See https://github.com/open-telemetry/opentelemetry-collector/blob/main/docs/security-best-practices.md#safeguards-against-denial-of-service-attacks

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

  jaeger:
    protocols:
      grpc:
        endpoint: 127.0.0.1:14250
      thrift_binary:
        endpoint: 127.0.0.1:6832
      thrift_compact:
        endpoint: 127.0.0.1:6831
      thrift_http:
        endpoint: 127.0.0.1:14268

  zipkin:
    endpoint: 127.0.0.1:9411

processors:
  batch:

exporters:
  debug:
    verbosity: detailed

  otlphttp:
    endpoint: http://192.168.1.241:4318

service:

  telemetry:
    # The debug exporter prints the received data through this same logger,
    # at info level, so the level cannot go lower without losing the data.
    logs:
      level: info
    # No internal metrics about the Collector itself.
    metrics:
      level: none

  pipelines:

    traces:
      receivers: [otlp, jaeger, zipkin]
      processors: [batch]
      exporters: [debug, otlphttp]
#     exporters: [kafka prometheus nop otlp otlphttp prometheusremotewrite zipkin debug file]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
